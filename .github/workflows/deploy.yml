name: Deploy Heliora ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: |
          cp dist/index.html dist/404.html
          mkdir -p dist/toko dist/kontak
          sed 's|src="./assets/|src="../assets/|g; s|href="./assets/|href="../assets/|g; s|href="./favicon.svg"|href="../favicon.svg"|g' dist/index.html > dist/toko/index.html
          sed 's|src="./assets/|src="../assets/|g; s|href="./assets/|href="../assets/|g; s|href="./favicon.svg"|href="../favicon.svg"|g' dist/index.html > dist/kontak/index.html
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
